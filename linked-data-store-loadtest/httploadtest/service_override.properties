# The start options of HTTPLoadTest-baseline, mounted over the file the image comes with. That file gives the JVM
# the option UseCGroupMemoryLimitForHeap, which the JDK of the image (13) does not have, so the load tester of
# the image as it is never starts. This is that file without the three options that went with it.
releaseRepo=http://mvnrepo.cantara.no/content/repositories/releases
snapshotRepo=http://mvnrepo.cantara.no/content/repositories/snapshots
groupId=no/cantara/service
artifactId=HTTPLoadTest-baseline
version=0.9-SNAPSHOT

APP=${artifactId}.jar
JAVA_PARAMS="-Dlogback.configurationFile=./config_override/logback.xml -Xms512m -Xmx3096m "

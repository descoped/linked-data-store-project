name: Documentation site

# Builds the site (site/, a krantho static site: a landing page, and the markdown files in docs/ as the documentation)
# and publishes it to GitHub Pages when either changes on master. Nothing of the Maven build runs here, and CI does not
# run for these paths. Pages is set to publish from GitHub Actions, on the custom domain lds.descoped.io.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'site/**'
      # served as /compose.yaml, the one-line start of the whole stack on the landing page
      - 'plugins/lds/skills/start/assets/compose-stack.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# One deployment at a time, and one that has started always finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history: each page is dated by its file's last commit
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      # The AVIF and WebP copies the build makes of the images in public/, kept from the last run: a copy is made
      # again only for an image that is new or has changed
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: site/public/_krantho
          key: krantho-images-${{ hashFiles('site/public/**/*.png', 'site/public/**/*.jpg', 'site/public/**/*.jpeg', 'site/public/**/*.webp', 'site/public/**/*.PNG', 'site/public/**/*.JPG', 'site/public/**/*.JPEG', 'site/public/**/*.WEBP') }}
          restore-keys: krantho-images-
      # Where Pages serves the site (https://lds.descoped.io, the custom domain), which every page's canonical link,
      # the sitemap and robots.txt name; on the domain's root, so the pages have no path before them
      - run: KRANTHO_SITE_BASE_URL="https://${BASE_URL#*://}" pnpm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

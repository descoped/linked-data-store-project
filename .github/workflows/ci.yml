name: CI

# One job on JDK 27, the baseline: Linked Data Store is a product and is built, tested and run on one JDK. Every
# run: build, tests and Javadoc of every module; the PostgreSQL tests start PostgreSQL 18 in Docker through
# Testcontainers. Pushes to master and release tags, and pull requests from this repository, add coverage and the
# SonarCloud analysis (not gating; pull requests from forks get no token). CI publishes nothing, neither to Maven
# Central nor to an image registry: releases are made by hand (see .claude/CLAUDE.md).
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch ends the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK 27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Coverage and SonarCloud: pushes, and pull requests from this repository (a fork's gets no secrets).
      ANALYSE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ env.ANALYSE == 'true' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '27'
          distribution: temurin
          cache: maven

      - name: Build, test and Javadoc
        if: env.ANALYSE != 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc

      - name: Build, test, Javadoc and coverage
        if: env.ANALYSE == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc -P coverage

      # Analysis only: a SonarCloud outage or token problem must not fail the build, so this step does not gate.
      # On a pull request the scanner reads the pull request number, branch and base from GitHub Actions itself.
      - name: SonarCloud
        if: env.ANALYSE == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress -P sonar org.sonarsource.scanner.maven:sonar-maven-plugin:sonar


name: CI

# One job on JDK 27, the baseline: Linked Data Store is a product and is built, tested and run on one JDK. Every
# run: build, tests and Javadoc, the modules that do not depend on each other at the same time (-T 1C); a push,
# a tag and a start by hand build every module, a pull request takes the modules whose inputs have not changed
# from the build cache; the tests start PostgreSQL 18, Neo4j and Solr in Docker through
# Testcontainers, build the image of the server and start its compose file with the docker command. Pushes to
# master and release tags, and pull requests from this repository, add coverage and the SonarCloud analysis (not
# gating; pull requests from forks get no token). CI publishes SNAPSHOTs only, to Descoped's AWS CodeArtifact
# repository, read at https://maven.descoped.io/ (the job snapshot), and nothing to Maven Central or an image
# registry: releases are made by hand (see .claude/CLAUDE.md).
# CI builds the products, so it runs only for what can change them: the root POM, the Maven wrapper, the
# modules and this file. The documentation (docs/, README.md and every other Markdown file), LICENSE, .claude/,
# Renovate's settings and claude.yml never start a build. A tag starts it whatever it changes: GitHub does not
# apply paths to a tag.
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'linked-data-store-*/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [master]
    paths:
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'linked-data-store-*/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request ends the run it replaces. A run on a branch is never ended by the next, so a
# publish of SNAPSHOTs is not stopped halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (JDK 27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Coverage and SonarCloud: pushes, and pull requests from this repository (a fork's gets no secrets).
      ANALYSE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      # The build cache (.mvn/maven-build-cache-config.xml): a pull request takes a module that has not changed, and
      # whose dependencies have not, from the cache without testing it again. A push (master, a tag) and a start by
      # hand look nothing up and build and test every module, so every engine is tested at every merge, and fill
      # the cache the pull requests read.
      CACHE: ${{ github.event_name == 'pull_request' && '-Dmaven.build.cache.skipCache=false' || '-Dmaven.build.cache.skipCache=true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ env.ANALYSE == 'true' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        id: java
        with:
          java-version: '27'
          distribution: temurin
          cache: maven

      # One entry for every run. A pull request starts from the newest entry of its own branch, else of master, made
      # with the same build: the JDK, the Maven wrapper, .mvn (the extension and its settings) and this file. The
      # cache does not count these as inputs of a module, so a change of one of them starts from an empty cache and
      # tests every module.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ steps.java.outputs.version }}-${{ hashFiles('mvnw', '.mvn/**', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: build-cache-${{ steps.java.outputs.version }}-${{ hashFiles('mvnw', '.mvn/**', '.github/workflows/ci.yml') }}-

      - name: Build, test and Javadoc
        if: env.ANALYSE != 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify $CACHE

      - name: Build, test, Javadoc and coverage
        if: env.ANALYSE == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify -P coverage $CACHE

      # Analysis only: a SonarCloud outage or token problem must not fail the build, so this step does not gate.
      # On a pull request the scanner reads the pull request number, branch and base from GitHub Actions itself.
      - name: SonarCloud
        if: env.ANALYSE == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress -Dmaven.build.cache.enabled=false -P sonar org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # The SNAPSHOTs of every module but the load test, to Descoped's AWS CodeArtifact repository maven-snapshots, read
  # publicly at https://maven.descoped.io/. Only after build has passed, on a push to master or a start by hand on a
  # branch; never for a pull request or a tag (and the role refuses a pull request). master publishes X.Y.Z-SNAPSHOT;
  # another branch publishes X.Y.Z-<branch>-SNAPSHOT, so it never replaces master's. The one input is the role, an
  # organization secret; the AWS account and the endpoint are looked up at run time and never written here.
  snapshot:
    name: Publish SNAPSHOTs
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runs on one branch never interleave their uploads of maven-metadata.xml.
    concurrency:
      group: snapshot-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '27'
          distribution: temurin
          cache: maven

      - name: Branch version
        if: github.ref != 'refs/heads/master'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.' '-')
          ./mvnw --batch-mode --no-transfer-progress versions:set -DgenerateBackupPoms=false \
            -DnewVersion="${version%-SNAPSHOT}-${name}-SNAPSHOT"

      - name: Only a SNAPSHOT
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) echo "Publishing $version" ;;
            *) echo "Not a SNAPSHOT: $version"; exit 1 ;;
          esac

      # The token, the endpoint and its origin are read from the environment of the deploy step; nothing secret is
      # written to disk. The token is sent to the CodeArtifact origin only.
      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>descoped-snapshots</id>
                <username>aws</username>
                <password>${env.CODEARTIFACT_AUTH_TOKEN}</password>
                <repositoryOrigins>
                  <repositoryOrigin>${env.SNAPSHOTS_ORIGIN}</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>descoped-codeartifact</id>
                <properties>
                  <descoped.snapshots.url>${env.SNAPSHOTS_URL}</descoped.snapshots.url>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>descoped-codeartifact</activeProfile>
            </activeProfiles>
          </settings>
          XML

      # Last before the deploy, so no other step runs while the role's credentials exist. They are not exported to
      # the job's environment: only the deploy step gets them, for at most 15 minutes.
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_SNAPSHOTS_ROLE_ARN }}
          aws-region: eu-north-1
          role-duration-seconds: 900
          output-credentials: true
          output-env-credentials: false

      # The token lives 15 minutes and only in this step's shell; the build and tests ran in build, so this is the
      # upload only. The build cache is off: every module is packaged from its sources.
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: eu-north-1
        run: |
          # The account ID is masked first, so the log hides it in every text that holds it (the endpoint, the
          # origin, a warning of Maven). The log of a public repository never shows it.
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          token=$(aws codeartifact get-authorization-token --domain descoped --duration-seconds 900 \
            --query authorizationToken --output text)
          echo "::add-mask::$token"
          export CODEARTIFACT_AUTH_TOKEN="$token"
          url=$(aws codeartifact get-repository-endpoint --domain descoped --repository maven-snapshots \
            --format maven --query repositoryEndpoint --output text)
          origin="${url%%/maven/*}"
          echo "::add-mask::$url"
          echo "::add-mask::$origin"
          export SNAPSHOTS_URL="$url" SNAPSHOTS_ORIGIN="$origin"
          # strict: a server without a declared origin gets no credentials, instead of getting them with a warning
          # that names the origin (Maven 3.10, OriginBoundAuthenticationSelector).
          ./mvnw --batch-mode --no-transfer-progress -T 1C -P descoped-snapshots -DskipTests \
            -Dmaven.build.cache.enabled=false -Dmaven.repository.credentialScope=strict deploy


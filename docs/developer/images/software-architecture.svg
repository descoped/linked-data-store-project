<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-labelledby="software-title software-desc">
  <title id="software-title">The software architecture of LDS</title>
  <desc id="software-desc">The server module starts core and puts every provider on the class path. Core holds the HTTP server, REST and GraphQL, the model and its validation, the turn of a write and its saga, the reads of the store, the transaction log, the index queue's worker and the lifecycles. Core knows only two contracts: the persistence API, which the memory, PostgreSQL and Neo4j providers implement and the shared suite tests, and the search API, which the Solr provider and the index queue in PostgreSQL implement.</desc>
  <style>
    .bg { fill: var(--diagram-bg, #ffffff); }
    .box { fill: var(--diagram-box, #f6f8fa); stroke: var(--diagram-line, #8c959f); stroke-width: 1.2; }
    .lds { fill: var(--diagram-accent-bg, #ddf4ff); stroke: var(--diagram-accent, #0969da); stroke-width: 1.6; }
    .part { fill: var(--diagram-bg, #ffffff); stroke: var(--diagram-accent, #0969da); stroke-width: 1; }
    .api { fill: var(--diagram-box, #f6f8fa); stroke: var(--diagram-accent, #0969da); stroke-width: 1.6; }
    .frame { fill: none; stroke: var(--diagram-line, #8c959f); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .dash { stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: var(--diagram-line, #8c959f); stroke-width: 1.5; }
    .head { fill: var(--diagram-line, #8c959f); }
    text { fill: var(--diagram-text, #1f2328); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; }
    .title { font-size: 14px; font-weight: 600; }
    .small { font-size: 11.5px; fill: var(--diagram-muted, #59636e); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--diagram-muted, #59636e); }
    @media (prefers-color-scheme: dark) {
      .bg, .part { fill: var(--diagram-bg, #0d1117); }
      .box, .api { fill: var(--diagram-box, #161b22); }
      .box, .frame { stroke: var(--diagram-line, #6e7681); }
      .lds { fill: var(--diagram-accent-bg, #0c2d4d); stroke: var(--diagram-accent, #4493f8); }
      .part, .api { stroke: var(--diagram-accent, #4493f8); }
      .edge { stroke: var(--diagram-line, #6e7681); }
      .head { fill: var(--diagram-line, #6e7681); }
      text { fill: var(--diagram-text, #e6edf3); }
      .small, .mono { fill: var(--diagram-muted, #9198a1); }
    }
  </style>
  <defs>
    <marker id="software-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="720" height="530"/>
  <rect class="box" x="12" y="12" width="696" height="54" rx="8"/>
  <text class="title" x="26" y="36">server</text>
  <text class="small" x="26" y="56">main class, defaults, example model, image; every provider on the class path</text>
  <path class="edge" d="M360 66 V84" marker-end="url(#software-arrow)"/>
  <rect class="lds" x="12" y="86" width="696" height="212" rx="12"/>
  <text class="title" x="28" y="110">core</text>
  <rect class="part" x="28" y="122" width="158" height="74" rx="6"/>
  <text x="40" y="146">HTTP server</text>
  <text class="mono" x="40" y="166">Undertow</text>
  <text class="small" x="40" y="184">CORS, health</text>
  <rect class="part" x="198" y="122" width="158" height="74" rx="6"/>
  <text x="210" y="146">REST and GraphQL</text>
  <text class="mono" x="210" y="166">graphql-java</text>
  <text class="small" x="210" y="184">no thread waits</text>
  <rect class="part" x="368" y="122" width="158" height="74" rx="6"/>
  <text x="380" y="146">The model</text>
  <text class="mono" x="380" y="166">JSON Schema 2020-12</text>
  <text class="small" x="380" y="184">checked before a write</text>
  <rect class="part" x="538" y="122" width="158" height="74" rx="6"/>
  <text x="550" y="146">A write</text>
  <text class="mono" x="550" y="166">Cantara saga</text>
  <text class="small" x="550" y="184">its turn, then the saga</text>
  <rect class="part" x="28" y="208" width="158" height="74" rx="6"/>
  <text x="40" y="232">Store reads</text>
  <text class="small" x="40" y="252">threads of the store</text>
  <text class="small" x="40" y="270">and of queries</text>
  <rect class="part" x="198" y="208" width="158" height="74" rx="6"/>
  <text x="210" y="232">Transaction log</text>
  <text class="mono" x="210" y="252">io.descoped.rawdata</text>
  <text class="small" x="210" y="270">an entry for every write</text>
  <rect class="part" x="368" y="208" width="158" height="74" rx="6"/>
  <text x="380" y="232">Index queue worker</text>
  <text class="small" x="380" y="252">and the rebuild</text>
  <text class="small" x="380" y="270">of the search index</text>
  <rect class="part" x="538" y="208" width="158" height="74" rx="6"/>
  <text x="550" y="232">Lifecycles</text>
  <text class="small" x="550" y="252">started in order,</text>
  <text class="small" x="550" y="270">stopped in reverse</text>
  <path class="edge" d="M186 298 V326" marker-end="url(#software-arrow)"/>
  <path class="edge" d="M560 298 V326" marker-end="url(#software-arrow)"/>
  <rect class="api" x="12" y="328" width="400" height="76" rx="8"/>
  <text class="title" x="26" y="352">persistence API</text>
  <text class="mono" x="26" y="372">RxJsonPersistence · bridge · Limits</text>
  <text class="small" x="26" y="390">streams on RxJava 3, Jackson trees</text>
  <rect class="api" x="420" y="328" width="288" height="76" rx="8"/>
  <text class="title" x="434" y="352">search API</text>
  <text class="mono" x="434" y="372">SearchIndex · IndexQueue · SearchQuery</text>
  <text class="small" x="434" y="390">one entry for every version</text>
  <path class="edge" d="M420 366 H414" marker-end="url(#software-arrow)"/>
  <path class="edge" d="M59 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box" x="12" y="458" width="94" height="60" rx="8"/>
  <text class="title" x="24" y="482">memory</text>
  <text class="small" x="24" y="502">to try LDS</text>
  <path class="edge" d="M161 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box" x="114" y="458" width="94" height="60" rx="8"/>
  <text class="title" x="126" y="482">PostgreSQL</text>
  <text class="small" x="126" y="502">one table</text>
  <path class="edge" d="M263 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box" x="216" y="458" width="94" height="60" rx="8"/>
  <text class="title" x="228" y="482">Neo4j</text>
  <text class="small" x="228" y="502">a graph</text>
  <path class="edge dash" d="M365 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box dash" x="318" y="458" width="94" height="60" rx="8"/>
  <text class="title" x="330" y="482">suite</text>
  <text class="small" x="330" y="502">tests each</text>
  <path class="edge" d="M490 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box" x="420" y="458" width="140" height="60" rx="8"/>
  <text class="title" x="432" y="482">Solr</text>
  <text class="small" x="432" y="502">one core, LDS schema</text>
  <path class="edge" d="M638 456 V406" marker-end="url(#software-arrow)"/>
  <rect class="box" x="568" y="458" width="140" height="60" rx="8"/>
  <text class="title" x="580" y="482">index queue</text>
  <text class="small" x="580" y="502">a PostgreSQL table</text>
</svg>

# A whole LDS to try on one machine: the server, Neo4j for the documents, PostgreSQL for the saga log and the
# transaction log, and Solr for search. For development only: the passwords are the ones written here, and
# every port is published on 127.0.0.1.
#
#   ./mvnw package -DskipTests
#   docker compose -f linked-data-store-server/compose.yaml up --build
#
# LDS answers on http://localhost:9090 with the model in schemas/ (restart the server after changing it). The
# data is kept in volumes between runs; "docker compose -f linked-data-store-server/compose.yaml down -v"
# removes it. A port that is taken on the machine is moved with LDS_PORT, NEO4J_HTTP_PORT, NEO4J_BOLT_PORT or
# SOLR_PORT (LDS_PORT=9190 docker compose ... up).
name: lds

services:

  lds:
    build: .
    # LDS can need 30 seconds or more to stop in order while a write is held up; Docker's 10 would cut it short.
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${SERVER_PORT:-9090}:9090"
    environment:
      LDS_PERSISTENCE_PROVIDER: neo4j
      LDS_NEO4J_DRIVER_URL: bolt://neo4j:7687
      LDS_NEO4J_DRIVER_USERNAME: neo4j
      LDS_NEO4J_DRIVER_PASSWORD: lds-development
      LDS_SAGALOG_PROVIDER: no.cantara.sagalog.postgres.PostgresSagaLogInitializer
      LDS_SAGALOG_CONFIG_CLUSTER_OWNER: development
      LDS_SAGALOG_CONFIG_CLUSTER_NAME: lds
      LDS_SAGALOG_CONFIG_CLUSTER_INSTANCE_ID: "01"
      LDS_SAGALOG_CONFIG_POSTGRES_DRIVER_HOST: postgres
      LDS_SAGALOG_CONFIG_POSTGRES_DRIVER_USER: lds
      LDS_SAGALOG_CONFIG_POSTGRES_DRIVER_PASSWORD: lds
      LDS_SAGALOG_CONFIG_POSTGRES_DRIVER_DATABASE: sagalog
      LDS_TXLOG_RAWDATA_PROVIDER: postgres
      LDS_TXLOG_CONFIG_POSTGRES_DRIVER_HOST: postgres
      LDS_TXLOG_CONFIG_POSTGRES_DRIVER_USER: lds
      LDS_TXLOG_CONFIG_POSTGRES_DRIVER_PASSWORD: lds
      LDS_TXLOG_CONFIG_POSTGRES_DRIVER_DATABASE: txlog
      LDS_GRAPHQL_SEARCH_ENABLED: "true"
      LDS_SEARCH_INDEX_PROVIDER: solr
      LDS_SEARCH_INDEX_URL: http://solr:8983/solr/lds-index
    volumes:
      - ./schemas:/lds/schemas:ro
    # LDS answers /ping under http.prefix, on the port it listens on in the container (9090, http.port).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/ping"]
      start_period: 60s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy

  # The browser of Neo4j is on http://localhost:7474 (user neo4j).
  neo4j:
    image: neo4j:2026.10-community
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    # A Neo4j for development (Operations Manual 2026.10, configuration settings): the transaction log is not made
    # 256 MiB in advance, is rotated at 16 MiB and keeps two files, and the memory is small and fixed instead of a
    # share of the machine.
    environment:
      NEO4J_AUTH: neo4j/lds-development
      NEO4J_db_tx__log_preallocate: "false"
      NEO4J_db_tx__log_rotation_size: 16M
      NEO4J_db_tx__log_rotation_retention__policy: 2 files
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "lds-development", "RETURN 1"]
      start_period: 60s
      start_interval: 2s
      interval: 10s
      timeout: 10s
      retries: 5

  # PostgreSQL stays at 18 (see .claude/CLAUDE.md, Invariants).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lds
      POSTGRES_PASSWORD: lds
      POSTGRES_DB: lds
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      # over TCP, which PostgreSQL answers only when postgres-init.sql has been run
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lds", "-d", "txlog"]
      start_period: 60s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

  # The admin pages of Solr are on http://localhost:8983.
  solr:
    image: solr:10.1
    command: ["solr-precreate", "lds-index"]
    ports:
      - "127.0.0.1:${SOLR_PORT:-8983}:8983"
    volumes:
      - solr:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8983/solr/lds-index/admin/ping"]
      start_period: 60s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j:
  postgres:
  solr:

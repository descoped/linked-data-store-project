# The defaults of the LDS server, over those of core (application-defaults.properties). As it stands LDS keeps
# everything in memory, which is for trying it: nothing is left when it stops.
#
# Every key here can be set from outside: in conf/application.properties under the working directory, by an
# environment variable (LDS_HTTP_PORT sets http.port, LDS_NEO4J_DRIVER_URL sets neo4j.driver.url) or by a system
# property. A variable or a system property sets only a key that a file has, which is why the keys of every
# provider are here, also of those that are not in use. No password has a default.

# The model: a GraphQL schema or, when graphql.schema is empty, the JSON Schema files named by
# specification.schema (folders and files, separated by commas).
graphql.enabled=true
graphql.schema=schemas/schema.graphql
specification.schema=schemas

# Where the documents are kept: mem, neo4j or postgres.
persistence.provider=mem
persistence.initialization.max-wait-seconds=60

# mem
persistence.fragment.capacity=8192

# neo4j
neo4j.driver.url=bolt://localhost:7687
neo4j.driver.username=neo4j
neo4j.driver.password=
neo4j.cypher.show=false

# postgres
postgres.driver.host=localhost
postgres.driver.port=5432
postgres.driver.user=lds
postgres.driver.password=
postgres.driver.database=lds

# The sagas, which carry the writes
saga.number-of-logs=30
saga.threadpool.core=50
saga.threadpool.max=100
saga.threadpool.keepalive.seconds=60
saga.threadpool.queue.capacity=10
saga.recovery.enabled=true
saga.recovery.interval.seconds.min=30
saga.recovery.interval.seconds.max=60

# The saga log: no.cantara.sagalog.memory.MemorySagaLogInitializer or
# no.cantara.sagalog.postgres.PostgresSagaLogInitializer
sagalog.provider=no.cantara.sagalog.memory.MemorySagaLogInitializer
sagalog.provider.initialization.max-wait-seconds=30
sagalog.provider.initialization.retry-interval-seconds=2
sagalog.config.cluster.instance-id=01

# The saga log in PostgreSQL. Its connection pool must have at least saga.number-of-logs + 11 connections (LDS does
# not start with fewer): one for each saga log, ten for the recovery of other instances, one for its own queries.
sagalog.config.postgres.driver.host=localhost
sagalog.config.postgres.driver.port=5432
sagalog.config.postgres.driver.user=lds
sagalog.config.postgres.driver.password=
sagalog.config.postgres.driver.database=sagalog
sagalog.config.connection-pool.max-size=50

# The transaction log: discard (none is kept) or postgres
txlog.split.sources=false
txlog.default-source=default
txlog.rawdata.topic-prefix=txlog-
txlog.rawdata.provider=discard
txlog.rawdata.provider.initialization.max-wait-seconds=30
txlog.rawdata.provider.initialization.retry-interval-seconds=2

# The transaction log in PostgreSQL
txlog.config.postgres.driver.host=localhost
txlog.config.postgres.driver.port=5432
txlog.config.postgres.driver.user=lds
txlog.config.postgres.driver.password=
txlog.config.postgres.driver.database=txlog

# Search, with the provider solr: the address is that of the core
graphql.search.enabled=false
search.index.provider=solr
search.index.url=http://localhost:8983/solr/lds-index
# Within how many milliseconds a write is found by search
search.index.commit-within=1000
# Whether the start rebuilds the search index from storage
search.index.rebuild=false
